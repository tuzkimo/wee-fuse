[package]
name = "weefuse"
version = "0.1.0"
description = "一起拼豆 WeeFuse"
edition = "2021"
rust-version = "1.77"

[lib]
# 官方模板口径：移动端把 App 编译成库、由平台框架加载，所以入口在 lib 里，main.rs 只转发。
name = "weefuse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
