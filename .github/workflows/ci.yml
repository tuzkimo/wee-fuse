name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build

      - name: 单元测试
        run: npm run test

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Tauri 的 Linux 前置库
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建前端（generate_context! 需要 dist/ 存在）
        run: npm run build

      - name: Rust 类型检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 2026-10-06（B5，人类伙伴批准后加）：**桌面 cargo check 看不到 `#[cfg(target_os = "android")]` 的代码** ✗
      # —— 本轮被这条咬过两次（`app.state()` 的临时值借用 E0716、`android_logger` 的 cfg），两次都只在
      # `tauri android build` 编 aarch64-linux-android 时才现形。这一步把它前移到 CI。
      # 说明：GitHub 托管的 ubuntu runner 自带 Android SDK（`ANDROID_HOME` 已设）；若某个 crate 需要 NDK 而
      # runner 上没有，这一步会**明确报缺什么**（而不是静默跳过）—— 那时再按报错补 NDK，别用 continue-on-error
      # 把它降级成假绿 ✗。
      - name: 安装 Android target
        run: rustup target add aarch64-linux-android

      - name: Rust 类型检查（Android target）
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android
