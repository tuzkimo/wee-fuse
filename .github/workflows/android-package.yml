name: android-package

# 「在线打包」：手动触发（Actions 页面 Run workflow）或推 v* tag 时，在 GitHub 的机器上出一个 APK。
#
# 设计取舍（2026-10-07，参考 wee-count 的 release-android.yml，但**参数按本仓真机验证过的那套**）：
# ① **debug APK 不需要任何 secret** ⇒ 谁都能一键打包、随时可复现（本仓的 debug 包就是真机验证用的那个 ✓）；
# ② **release APK 与 GitHub Release 只在提供了签名 secrets 时才跑** ⇒ 没有 secret 不会让整条流水线变红（跳过即可 ✓）；
# ③ 参数来自本机**真实构建成功**的那套：NDK 30.0.14904198 / compileSdk·targetSdk 37 / Java 17 Temurin /
#    JVM target 1.8 / gradle wrapper 9.6.1（由 wrapper 自己下）⇒ 别照抄别的项目的 NDK 版本 ✗。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # 用 env 把 secret 暴露出来，才能用 `if: env.X != ''` 判断「有没有配签名」✓（`if` 里不能直接读 secrets ✗）。
    env:
      NDK_VERSION: 30.0.14904198
      ANDROID_PLATFORM: android-37
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 平台与 NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;${ANDROID_PLATFORM}" "ndk;${NDK_VERSION}" > /dev/null
          # Tauri 的 rustBuild* 任务要能定位 NDK；两个变量名都设上，省得踩「名字对不上、静默换版本」✗
          echo "NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 单元测试
        run: npm run test

      # 与 ci.yml 的 Android target 检查同源：**桌面 cargo check 看不到 `#[cfg(target_os = "android")]` 的代码** ✗，
      # 放在这里是为了让「能打包」这件事在**真正编 Android 之前**就先失败得清清楚楚 ✓。
      - name: Rust 类型检查（Android target）
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android

      - name: 校验 tag 与 tauri.conf.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAURI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 tauri.conf.json 的版本 ${TAURI_VERSION} 不一致 ⇒ 先 bump 版本号，或改用正确的 tag"
            exit 1
          fi
          echo "版本一致：${TAURI_VERSION}"

      - name: 构建 debug APK（arm64；无需任何 secret）
        run: npx tauri android build --apk --debug --target aarch64

      - name: 收集 debug APK
        run: |
          mkdir -p out
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::没找到 debug APK 产物"; exit 1; fi
          NAME="weefuse-${{ github.ref_name }}-arm64-debug.apk"
          cp "$APK" "out/${NAME}"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: weefuse-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---- 以下只在「配了签名 secrets」时才跑（没配就跳过，不把流水线弄红 ✓）----

      - name: 还原签名材料
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/weefuse.jks
          cat > src-tauri/gen/android/app/key.properties <<EOF
          storeFile=weefuse.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: 构建 release APK（arm64，已签名）
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: npx tauri android build --apk --target aarch64

      - name: 收集 release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p out-release
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::没找到 release APK 产物"; exit 1; fi
          cp "$APK" "out-release/weefuse-${{ github.ref_name }}-arm64-release.apk"
          ls -l out-release

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: weefuse-release-apk
          path: out-release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release（仅在 tag 上、且有签名时）
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out-release/*.apk
          generate_release_notes: true
